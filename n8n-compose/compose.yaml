services:
  n8n:
    image: n8nio/n8n
    restart: always
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_RUNNERS_ENABLED=true
      - N8N_SECURE_COOKIE=false  
      - NODE_ENV=production
      - N8N_WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Hong_Kong
      - TZ=Asia/Hong_Kong
    volumes:
      - ./n8n_data:/home/node/.n8n
      - ./local-files:/files